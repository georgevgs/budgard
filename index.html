    <!-- Theme initialization - runs before first paint to prevent flash.
         Inlined (not a file) so it doesn't cost a render-blocking request.
         IMPORTANT: any change to the inline script below (even whitespace)
         requires recomputing the sha256 hash in the netlify.toml CSP from
         the built dist/index.html. -->
    <script>(function () {
  var savedTheme = localStorage.getItem('theme') || 'light';
  var root = document.documentElement;
  root.setAttribute('data-theme', savedTheme);
  if (savedTheme === 'dark') {
    root.classList.add('dark');
  }

  // Barbie has its own fixed palette — skip accent override
  if (savedTheme === 'barbie') return;

  // Apply saved accent color to prevent flash
  var accents = {
    sunset:   { light: ['15 100% 61%', '248 32% 12%'], dark: ['15 100% 65%', '252 45% 9%'] },
    ocean:    { light: ['199 100% 48%', '205 90% 12%'], dark: ['195 100% 65%', '205 90% 10%'] },
    lavender: { light: ['257 92% 62%', '0 0% 100%'], dark: ['258 100% 72%', '252 45% 9%'] },
    mint:     { light: ['162 83% 40%', '164 80% 10%'], dark: ['160 86% 50%', '164 80% 8%'] },
    coral:    { light: ['340 100% 61%', '0 0% 100%'], dark: ['340 100% 68%', '340 60% 9%'] },
    gold:     { light: ['43 100% 51%', '34 85% 12%'], dark: ['45 100% 60%', '34 85% 10%'] },
    slate:    { light: ['235 24% 44%', '0 0% 100%'], dark: ['231 24% 65%', '240 28% 9%'] }
  };
  var key = localStorage.getItem('accent-color');
  var a = key && accents[key];
  if (a) {
    var vals = savedTheme === 'dark' ? a.dark : a.light;
    root.style.setProperty('--primary', vals[0]);
    root.style.setProperty('--primary-foreground', vals[1]);
    root.style.setProperty('--ring', vals[0]);
  }
})();</script>
