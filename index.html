<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <!-- Security headers are set via HTTP headers in netlify.toml -->

    <!-- Note: frame-ancestors and X-Frame-Options only work as HTTP headers -->
    <link rel="dns-prefetch" href="https://htamokfphaqudeivpowr.supabase.co">
    <link rel="preconnect" href="https://htamokfphaqudeivpowr.supabase.co" crossorigin="">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
    <meta name="description" content="A calm money companion for everyday spending decisions">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Budgard — Your calm money companion">
    <meta property="og:description" content="Know what is safe to spend today, without spreadsheets or shame.">
    <meta property="og:url" content="https://budgard.com">
    <meta property="og:image" content="https://budgard.com/og-image.png">
    <meta property="og:site_name" content="Budgard">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Budgard — Your calm money companion">
    <meta name="twitter:description" content="Know what is safe to spend today, without spreadsheets or shame.">
    <meta name="twitter:image" content="https://budgard.com/og-image.png">

    <!-- Web App Manifest (standard) -->
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Apple iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Budgard">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Browser and pinned-tab marks -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="mask-icon" href="/brand/budgard-mark.svg" color="#171717">
    <title>Budgard — Your calm money companion</title>

    <!-- Theme initialization — runs before first paint so the saved theme and
         accent are on the element before the first frame. The script is
         GENERATED from src/design/tokens.ts and injected here at build time by
         plugins/designTokens.ts, which also keeps the netlify.toml CSP hash in
         step. Do not inline a script by hand in its place. -->
    <!--THEME_INIT-->

    <!-- Generated by plugins/brandAssets.ts so device, orientation, appearance,
         file inventory, and cache revisions cannot drift apart. -->
    <!--APPLE_SPLASH_IMAGES-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
