# Serve reset.html directly — must come before the SPA catch-all
[[redirects]]
  from = "/reset"
  to = "/reset.html"
  status = 200

# Content-hashed assets must 404 when they are missing — they must NOT reach
# the SPA catch-all below. Netlify would otherwise answer a dead chunk URL with
# index.html at status 200, and the immutable /assets/* header further down
# stamps that HTML with a one-year cache. The browser then holds HTML under a
# .js URL forever, fails to parse it as a module, and the app white-screens
# until storage is cleared — which is why the failure survives a reload.
# Real files are matched before redirects are evaluated, so live assets are
# unaffected. /ocr/* and /workbox-* carry the same immutable header and get
# the same guard.
#
# RESIDUAL HAZARD, handled at the CDN rather than here. Netlify matches
# [[headers]] rules against the REQUEST path, not the redirect destination
# (verified: /index.html returns no-cache, but a path rewritten to it returns
# the default). So the immutable header below lands on this 404 as well, and a
# dead chunk URL is cached as immutable for a year at the edge. That is
# harmless for a URL that is dead forever, but not for one that comes back:
# roll a deploy back and forward again and any 404 served in between pins that
# chunk as missing for a year for everyone behind that edge node -- the same
# class of failure as the poisoning above, with a 404 in place of the HTML.
# It cannot be fixed here, because a missing chunk and a live one are the same
# shape and any rule narrow enough to catch one catches both. A Cloudflare
# Cache Rule holds it instead: "Edge TTL -> by status code -> 404 -> no cache".
# If Cloudflare is ever removed from in front of Netlify, that guard goes with
# it and this becomes live again.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404

[[redirects]]
  from = "/ocr/*"
  to = "/ocr/:splat"
  status = 404

# The workbox runtime is content-hashed and carries the same immutable header,
# so it needs the same guard and did not have one. A stale service worker asks
# for the hash it was built against; once that file is gone the catch-all below
# answered with index.html at 200, and the browser then held HTML under
# /workbox-<hash>.js for a year. importScripts fails on it, so the worker never
# installs and the update path stays broken until storage is cleared.
[[redirects]]
  from = "/workbox-*"
  to = "/workbox-:splat"
  status = 404

# /splash/* and /icons/* are not fingerprinted and carry a 30-day max-age
# rather than immutable, so a poisoned entry expires in a month instead of a
# year and an image degrades rather than white-screening. Guarded anyway: the
# rule for adding a cache header is that it comes with a 404 redirect, and an
# unguarded path is how /workbox-* stayed poisonable for a day.
# NOTE: public/icons/ is currently empty -- the PWA icons live at the web root
# (/icon-192x192.png and friends), so the /icons/* header below has no files to
# apply to. The guard is kept so the path cannot serve the app shell if
# anything is ever put there.
[[redirects]]
  from = "/splash/*"
  to = "/splash/:splat"
  status = 404

[[redirects]]
  from = "/icons/*"
  to = "/icons/:splat"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run test && npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # The sha256 hash allows the inline theme-init script in index.html.
    # DO NOT edit it by hand: the script is generated from src/design/tokens.ts
    # and plugins/designTokens.ts rewrites this line on every build. Commit the
    # change it makes — src/design/tokens.test.ts fails the build if the hash
    # here does not match the script that would be inlined.
    # connect-src carries no wss:// origin on purpose. supabase-js builds a
    # RealtimeClient in its constructor, but src/lib/realtimeStub.ts is aliased
    # over @supabase/realtime-js in vite.config.ts and throws on channel(), so
    # no socket is ever opened. Deleting that alias means adding
    # wss://htamokfphaqudeivpowr.supabase.co back here.
    # 'wasm-unsafe-eval' permits WebAssembly compilation only (NOT eval) —
    # required by the self-hosted Tesseract OCR runtime; Chromium blocks
    # WebAssembly.compile without it while Safari/Firefox don't enforce, so
    # missing it would surface as a Chrome/Android-only scan failure.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-2JvhQJmsh8CCLI5R5n9UWpamcYAeerR79MeJrJZq7hU=' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://htamokfphaqudeivpowr.supabase.co https://cloudflareinsights.com https://challenges.cloudflare.com https://*.sentry.io https://api.frankfurter.dev; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self';"

# no-cache (not no-store): the browser must revalidate, but can reuse the
# cached body on a 304 and keep the page eligible for back/forward cache.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The workbox runtime filename is content-hashed (workbox-<hash>.js), so it
# can be cached forever like /assets/*.
[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# OCR runtime (Tesseract worker + wasm cores + traineddata). Immutable is
# safe: the core path embeds the tesseract.js version (/ocr/tesseract-X.Y.Z/)
# and the tessdata folder must be renamed whenever its files are refreshed.
[[headers]]
  for = "/ocr/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images are not fingerprinted but change rarely; a bounded max-age
# avoids a revalidation request per image on every load. The service worker
# precaches them anyway, so installed PWAs always stay consistent.
[[headers]]
  for = "/splash/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Every other static path here declares its own policy, so these two do too
# rather than inheriting a default from Netlify and Cloudflare in turn. One
# hour: long enough that a crawler re-fetching them costs nothing, short
# enough that adding a page to the sitemap is picked up the same day.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon-192x192.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon-512x512.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
