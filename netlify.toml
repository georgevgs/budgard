# Serve reset.html directly — must come before the SPA catch-all
[[redirects]]
  from = "/reset"
  to = "/reset.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build]
  command = "npm run test && npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # The sha256 hash allows the inline theme-init script in index.html.
    # Recompute from dist/index.html whenever that script changes:
    #   node -e "const m=require('fs').readFileSync('dist/index.html','utf8').match(/<script>([\s\S]*?)<\/script>/);console.log('sha256-'+require('crypto').createHash('sha256').update(m[1]).digest('base64'))"
    # 'wasm-unsafe-eval' permits WebAssembly compilation only (NOT eval) —
    # required by the self-hosted Tesseract OCR runtime; Chromium blocks
    # WebAssembly.compile without it while Safari/Firefox don't enforce, so
    # missing it would surface as a Chrome/Android-only scan failure.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-spysep1/V1ppBbF/gVu5gl6WCnLucOZLWJX5aUNRwnk=' https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://htamokfphaqudeivpowr.supabase.co wss://htamokfphaqudeivpowr.supabase.co https://cloudflareinsights.com https://challenges.cloudflare.com https://*.sentry.io https://api.frankfurter.dev; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; base-uri 'self'; form-action 'self';"

# no-cache (not no-store): the browser must revalidate, but can reuse the
# cached body on a 304 and keep the page eligible for back/forward cache.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The workbox runtime filename is content-hashed (workbox-<hash>.js), so it
# can be cached forever like /assets/*.
[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# OCR runtime (Tesseract worker + wasm cores + traineddata). Immutable is
# safe: the core path embeds the tesseract.js version (/ocr/tesseract-X.Y.Z/)
# and the tessdata folder must be renamed whenever its files are refreshed.
[[headers]]
  for = "/ocr/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images are not fingerprinted but change rarely; a bounded max-age
# avoids a revalidation request per image on every load. The service worker
# precaches them anyway, so installed PWAs always stay consistent.
[[headers]]
  for = "/splash/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon-192x192.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icon-512x512.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
