name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check Edge Functions against frozen dependency graphs
        run: bun run edge:check
      - name: Audit frontend, tooling and Edge Function dependencies
        run: bun run audit:dependencies
      - name: Verify dependency checks did not change lockfiles
        run: git diff --exit-code
