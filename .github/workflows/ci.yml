name: CI

# Netlify runs the unit suite before it builds, but that is the last gate
# before production. This runs the same checks plus the ones a build cannot
# do — bundle budgets — on every push and pull request, so a regression is
# caught while the change is still being written.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # bunfig.toml sets frozenLockfile, so this fails rather than silently
      # resolving a different tree than the one that was reviewed.
      - name: Install
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # The suite carries the repo invariants too: component line cap,
      # translation parity, and design-token drift.
      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Reads dist/, so it has to follow the build.
      - name: Bundle budgets
        run: bun run budget

      # The token pipeline rewrites generated CSS, the inline theme script in
      # index.html and the CSP hash in netlify.toml during the build. If the
      # build changed any of them, the committed versions were stale.
      - name: Generated files are committed
        run: |
          if ! git diff --quiet; then
            echo "::error::The build rewrote generated files that are not committed."
            git diff --stat
            git diff
            exit 1
          fi

  e2e:
    name: End-to-end journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install
        run: bun install

      # Only Chromium — the suite asserts app behaviour, not engine differences,
      # and the other two browsers triple install time for no extra signal.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      # Builds and previews in --mode e2e, which points the app at a
      # placeholder Supabase host that the suite intercepts. No secrets needed.
      - name: Run journeys
        run: bunx playwright test

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
